<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabajo TP Firebase Pastelería</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Trabajo TP Firebase Pastelería</h1>

    <section>
        <h2>Registrar Receta</h2>
        <form id="formReceta">
            <input type="text" id="nombreReceta" placeholder="Nombre de la receta" required>
            <input type="text" id="pastelero" placeholder="Chef / Pastelero/a" required>
            <input type="text" id="categoria" placeholder="Categoría" required>
            <input type="number" id="tiempoPreparacion" placeholder="Tiempo (min)" required>
            <input type="text" id="dificultad" placeholder="Dificultad" required>
            <input type="url" id="imagenUrl" placeholder="URL de la imagen" required>
            <button type="submit">Guardar Receta</button>
        </form>
    </section>

    <section>
        <h2>Lista de Recetas</h2>
        <table border="1">
            <thead>
                <tr>
                    <th>Imagen</th>
                    <th>Receta</th>
                    <th>Chef / Pastelero/a</th>
                    <th>Categoría</th>
                    <th>Tiempo</th>
                    <th>Dificultad</th>
                </tr>
            </thead>
            <tbody id="tablaRecetas"></tbody>
        </table>
    </section>

    <script type="module" src="app.js"></script>
</body>
</html>
